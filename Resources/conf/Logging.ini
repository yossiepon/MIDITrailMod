[Logging]
; Log level: trace, debug, info, warn, error, critical
; Default: debug (Debug build), warn (Release build)
Level=debug

; Maximum number of log files to keep (0 = unlimited)
MaxFiles=7

; Enable OutputDebugString output (0=off, 1=on)
; Default: 1 (Debug build), 0 (Release build)
MsvcSink=0

; Log output directory (empty = default: exe/logs/)
; Relative paths are resolved from the exe directory
OutputDir=
